name: docker build and push

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      repository:
          type: string
          required: true
      registry:
          type: string
          required: false
          default: docker.io
      project:
          type: string
          required: false
          default: main
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true
      slack_bot_token:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tag
        if: ${{ inputs.tag == null }}
        id: tag
        env:
          PREFIX: ${{ github.ref_name == 'main' && github.ref_name || 'dev' }}
        run: echo "tag=${PREFIX}.${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          no-cache: false
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ inputs.tag || steps.tag.outputs.tag }}
          tags: |
            ${{ inputs.registry }}/${{ inputs.project }}/${{ inputs.repository }}:${{ inputs.tag || steps.tag.outputs.tag }}
            ${{ inputs.registry }}/${{ inputs.project }}/${{ inputs.repository }}:latest
